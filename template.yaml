AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Onward Logistics - automated, auditable onboarding of three engineers.
  Groups grant permissions (AWS managed policies), permissions boundaries cap
  each user, Secrets Manager generates first-login passwords. No inline policies.
  Follows company standards: names onward-<environment>-<purpose>; tags Project, Owner, Environment.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, test, prod]
    Default: dev
    Description: Environment name used in resource names and tags (company naming standard)
  Owner:
    Type: String
    Default: Effie Njoki
    Description: Person responsible for these resources (company tagging standard)

Resources:

  # ---------------------------------------------------------------------------
  # 1. SECRETS: one generated first-login password per engineer
  #    (no shared or plain-text credential; Name omitted so a rebuild never clashes)
  # ---------------------------------------------------------------------------
  S3UserSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Initial console password for s3-user (must be changed at first sign-in)
      GenerateSecretString:
        SecretStringTemplate: '{"username": "s3-user"}'
        GenerateStringKey: password
        PasswordLength: 20
        RequireEachIncludedType: true
        ExcludeCharacters: '"@/\'
      Tags:
        - Key: Project
          Value: onward
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  Ec2User1Secret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Initial console password for ec2-user-1 (must be changed at first sign-in)
      GenerateSecretString:
        SecretStringTemplate: '{"username": "ec2-user-1"}'
        GenerateStringKey: password
        PasswordLength: 20
        RequireEachIncludedType: true
        ExcludeCharacters: '"@/\'
      Tags:
        - Key: Project
          Value: onward
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  Ec2User2Secret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Initial console password for ec2-user-2 (must be changed at first sign-in)
      GenerateSecretString:
        SecretStringTemplate: '{"username": "ec2-user-2"}'
        GenerateStringKey: password
        PasswordLength: 20
        RequireEachIncludedType: true
        ExcludeCharacters: '"@/\'
      Tags:
        - Key: Project
          Value: onward
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------------------------
  # 2. PERMISSIONS BOUNDARIES: the maximum each engineer can EVER have.
  #    They grant nothing on their own; they cap whatever the group gives.
  # ---------------------------------------------------------------------------
  StorageBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'onward-${Environment}-boundary-storage'
      Description: Maximum permissions for storage engineers - S3 only
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CapAtS3
            Effect: Allow
            Action: 's3:*'
            Resource: '*'
          - Sid: AllowOwnPasswordChange
            Effect: Allow
            Action:
              - 'iam:ChangePassword'
              - 'iam:GetUser'
            Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:user/${!aws:username}'
          - Sid: AllowReadPasswordPolicy
            Effect: Allow
            Action: 'iam:GetAccountPasswordPolicy'
            Resource: '*'

  ComputeBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'onward-${Environment}-boundary-compute'
      Description: Maximum permissions for compute engineers - EC2 plus read-only monitoring
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CapAtEc2
            Effect: Allow
            Action: 'ec2:*'
            Resource: '*'
          - Sid: AllowReadMonitoring
            Effect: Allow
            Action:
              - 'cloudwatch:Describe*'
              - 'cloudwatch:Get*'
              - 'cloudwatch:List*'
            Resource: '*'
          - Sid: AllowOwnPasswordChange
            Effect: Allow
            Action:
              - 'iam:ChangePassword'
              - 'iam:GetUser'
            Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:user/${!aws:username}'
          - Sid: AllowReadPasswordPolicy
            Effect: Allow
            Action: 'iam:GetAccountPasswordPolicy'
            Resource: '*'

  OnCallBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'onward-${Environment}-boundary-oncall'
      Description: Maximum permissions for on-call engineers - observe EC2 only, never create or terminate
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CapAtObserveEc2
            Effect: Allow
            Action: 'ec2:Describe*'
            Resource: '*'
          - Sid: AllowReadMonitoring
            Effect: Allow
            Action:
              - 'cloudwatch:Describe*'
              - 'cloudwatch:Get*'
              - 'cloudwatch:List*'
            Resource: '*'
          - Sid: AllowOwnPasswordChange
            Effect: Allow
            Action:
              - 'iam:ChangePassword'
              - 'iam:GetUser'
            Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:user/${!aws:username}'
          - Sid: AllowReadPasswordPolicy
            Effect: Allow
            Action: 'iam:GetAccountPasswordPolicy'
            Resource: '*'
          - Sid: NeverCreateOrTerminateCompute
            Effect: Deny
            Action:
              - 'ec2:RunInstances'
              - 'ec2:TerminateInstances'
              - 'ec2:CreateFleet'
              - 'ec2:RequestSpotInstances'
              - 'ec2:RequestSpotFleet'
            Resource: '*'

  # ---------------------------------------------------------------------------
  # 3. GROUPS: grant permissions by job role, using AWS managed policies
  #    (no inline policies, no recreating policies AWS already maintains)
  # ---------------------------------------------------------------------------
  StorageEngineersGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: !Sub 'onward-${Environment}-storage-engineers'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonS3FullAccess'
        - 'arn:aws:iam::aws:policy/IAMUserChangePassword'

  ComputeEngineersGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: !Sub 'onward-${Environment}-compute-engineers'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonEC2FullAccess'
        - 'arn:aws:iam::aws:policy/IAMUserChangePassword'

  OnCallEngineersGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: !Sub 'onward-${Environment}-oncall-engineers'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonEC2ReadOnlyAccess'
        - 'arn:aws:iam::aws:policy/IAMUserChangePassword'

  # ---------------------------------------------------------------------------
  # 4. USERS: one per engineer (names required by the lab), placed in a group,
  #    capped by a boundary, console password from Secrets Manager,
  #    forced change at first sign-in. No access keys are created.
  # ---------------------------------------------------------------------------
  S3User:
    Type: AWS::IAM::User
    Properties:
      UserName: s3-user
      Groups:
        - !Ref StorageEngineersGroup
      PermissionsBoundary: !Ref StorageBoundary
      LoginProfile:
        Password: !Sub '{{resolve:secretsmanager:${S3UserSecret}:SecretString:password}}'
        PasswordResetRequired: true
      Tags:
        - Key: Project
          Value: onward
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment
        - Key: JobRole
          Value: StorageEngineer

  Ec2User1:
    Type: AWS::IAM::User
    Properties:
      UserName: ec2-user-1
      Groups:
        - !Ref ComputeEngineersGroup
      PermissionsBoundary: !Ref ComputeBoundary
      LoginProfile:
        Password: !Sub '{{resolve:secretsmanager:${Ec2User1Secret}:SecretString:password}}'
        PasswordResetRequired: true
      Tags:
        - Key: Project
          Value: onward
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment
        - Key: JobRole
          Value: ComputeEngineer

  Ec2User2:
    Type: AWS::IAM::User
    Properties:
      UserName: ec2-user-2
      Groups:
        - !Ref OnCallEngineersGroup
      PermissionsBoundary: !Ref OnCallBoundary
      LoginProfile:
        Password: !Sub '{{resolve:secretsmanager:${Ec2User2Secret}:SecretString:password}}'
        PasswordResetRequired: true
      Tags:
        - Key: Project
          Value: onward
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment
        - Key: JobRole
          Value: OnCallEngineer

Outputs:
  SignInUrl:
    Description: Console sign-in link for the new engineers
    Value: !Sub 'https://${AWS::AccountId}.signin.aws.amazon.com/console'
  S3UserSecretArn:
    Description: Secret holding s3-user's first-login password
    Value: !Ref S3UserSecret
  Ec2User1SecretArn:
    Description: Secret holding ec2-user-1's first-login password
    Value: !Ref Ec2User1Secret
  Ec2User2SecretArn:
    Description: Secret holding ec2-user-2's first-login password
    Value: !Ref Ec2User2Secret
